<script>
const D={fut8:['⚽','Fútbol 8','Goles','GF','GC'],sal:['🥅','Fútbol de salón','Goles','GF','GC'],vol:['🏐','Voleibol','Sets','SF','SC'],bas:['🏀','Básquetbol','Cestas','PF','PC'],fro:['🎾','Frontón','Puntos','PF','PC']};
const TH={fut8:['#16a34a','#65a30d'],sal:['#ea580c','#f59e0b'],vol:['#2563eb','#06b6d4'],bas:['#dc2626','#f97316'],fro:['#7c3aed','#db2777']};
const po=c=>{const p=c.po||(c.po={q:4,third:1});p.q=Math.max(2,Math.min(p.q,c.teams.length));return p};
const qn=c=>c.po?Math.min(c.po.q,c.teams.length):0;
function win(m){if(m.bye)return m.h;if(m.wo=='d')return null;if(m.wo)return m.wo=='h'?m.h:m.a;if(m.hs!=null&&m.as!=null){if(m.hs>m.as)return m.h;if(m.as>m.hs)return m.a;return m.pw=='h'?m.h:m.pw=='a'?m.a:null}return null}
function los(m){const w=win(m);return w&&!m.bye?(w==m.h?m.a:m.h):null}
function adv(c){const all=c.br.rounds.flatMap(r=>r.ms),g=id=>all.find(x=>x.id==id);c.br.rounds.forEach(r=>r.ms.forEach(m=>['h','a'].forEach(k=>{const s=m['s'+k];if(!s)return;const src=g(s.m),n=(s.w=='W'?win(src):los(src))||null;if(m[k]&&m[k]!=n){m.hs=m.as=m.wo=m.pw=null;m.sets=null}m[k]=n})));save()}
function genBr(c){const q=po(c).q,rows=calc(c).slice(0,q).map(s=>s.id);let n=2;while(n<q)n*=2;let a=[1,2];while(a.length<n){const k=a.length*2+1;a=a.flatMap(x=>[x,k-x])}
const nmR=k=>k==1?'Final':k==2?'Semifinal':k==4?'Cuartos de final':k==8?'Octavos de final':'Ronda de '+k*2;let prev=[],rs=[];
for(let cnt=n/2,r=0;cnt>=1;cnt/=2,r++){const ms=[];for(let i=0;i<cnt;i++){const m={id:uid(),h:null,a:null,hs:null,as:null,wo:null,pw:null,s:'',nm:cnt==1?'Final':nmR(cnt)+' '+(i+1)};
if(r==0){m.h=rows[a[2*i]-1]||null;m.a=rows[a[2*i+1]-1]||null;if(!m.a)m.bye=true}else{m.sh={m:prev[2*i].id,w:'W'};m.sa={m:prev[2*i+1].id,w:'W'};m.lh='Ganador '+prev[2*i].nm;m.la='Ganador '+prev[2*i+1].nm}ms.push(m)}rs.push({name:nmR(cnt),ms});prev=ms}
if(po(c).third&&rs.length>=2){const sm=rs[rs.length-2].ms;rs[rs.length-1].ms.push({id:uid(),h:null,a:null,hs:null,as:null,wo:null,pw:null,s:'',nm:'Tercer puesto',sh:{m:sm[0].id,w:'L'},sa:{m:sm[1].id,w:'L'},lh:'Perdedor '+sm[0].nm,la:'Perdedor '+sm[1].nm})}
c.br={rounds:rs};adv(c)}
const gbr=()=>{const c=cur().c;if(c.teams.length<2)return dlg('Inscribe al menos 2 equipos.','',()=>{},'c');const f=()=>{genBr(c);R()};c.br?dlg('Se regenerarán las llaves y se perderán sus resultados. ¿Continuar?','',f,'c'):f()};
const poS=(k,v)=>{po(cur().c)[k]=+v;save()};
const bsc=(id,k,v)=>{const m=fm(id);m[k]=v===''?null:Math.max(0,+v);m.pw=null;adv(cur().c);R()};
const bpw=(id,v)=>{fm(id).pw=v||null;adv(cur().c);R()};
const bs=(id,v)=>{fm(id).s=v;save()};
const ms=(id,k,v)=>{const c=cur().c,m=fm(id);m[k]=v||null;if(m.nm&&!m.sh)m.bye=!!(m.h&&!m.a);if(c.br)adv(c);R()};
const rd=(i,v)=>{cur().c.rounds[i].d=v;R()};
const rb=(i,v)=>{cur().c.rounds[i].bye=v||null;R()};
const am=i=>{const c=cur().c;c.rounds[i].ms.push({id:uid(),h:c.teams[0].id,a:(c.teams[1]||c.teams[0]).id,hs:null,as:null,wo:null,s:slotsOf(c)[0]});R()};
const dm=id=>{cur().c.rounds.forEach(r=>r.ms=r.ms.filter(m=>m.id!=id));R()};
const mv=(id,n)=>{if(n==='')return;const c=cur().c;let m;c.rounds.forEach(r=>{const x=r.ms.find(y=>y.id==id);if(x){m=x;r.ms=r.ms.filter(y=>y!=x)}});c.rounds[+n].ms.push(m);R()};
const dr=i=>dlg('¿Eliminar la fecha '+cur().c.rounds[i].n+' y sus partidos?','',()=>{const c=cur().c;c.rounds.splice(i,1);c.rounds.forEach((r,k)=>r.n=k+1);R()},'c');
const ar=()=>{const c=cur().c;c.rounds.push({n:c.rounds.length+1,bye:null,ms:[]});R()};
function fxe(c){const sl=slotsOf(c),to=v=>c.teams.map(t=>`<option value="${t.id}" ${t.id==v?'selected':''}>${esc(t.name)}</option>`).join('');
return c.rounds.map((r,i)=>`<div class="card"><div class="bar"><b style="min-width:0">Fecha ${r.n}</b><input type="date" value="${esc(r.d||'')}" onchange="rd(${i},this.value)"><span class="mu">Descansa</span><select onchange="rb(${i},this.value)"><option value="">—</option>${to(r.bye)}</select><button onclick="am(${i})">＋ Partido</button><button onclick="dr(${i})">🗑</button></div>${r.ms.map(m=>`<div class="m"><select onchange="ms('${m.id}','s',this.value)">${[...new Set([...sl,m.s])].map(x=>`<option ${x==m.s?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="t" onchange="ms('${m.id}','h',this.value)">${to(m.h)}</select><b>vs</b><select class="t" onchange="ms('${m.id}','a',this.value)">${to(m.a)}</select><select onchange="mv('${m.id}',this.value)"><option value="">Mover a…</option>${c.rounds.map((q,k)=>k==i?'':`<option value="${k}">Fecha ${q.n}</option>`).join('')}</select><button onclick="dm('${m.id}')">✕</button></div>`).join('')}</div>`).join('')+`<button class="pr" onclick="ar()">＋ Agregar fecha</button>`}
function bm(c,m,ro){const vol=S.disc=='vol',w=win(m),ed=S.be&&!ro&&!m.sh,tms=k=>`<select onchange="ms('${m.id}','${k}',this.value)"><option value="">—</option>${c.teams.map(t=>`<option value="${t.id}" ${t.id==m[k]?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`;
const ln=k=>{const id=m[k],t=id?tm(c,id):null,sk=k=='h'?'hs':'as',lb=m.bye&&k=='a'?'BYE':(m['l'+k]||'Por definir');const nm=ed?tms(k):t?bd(t):`<span class="mu">${esc(lb)}</span>`;
const sc=m.bye||m.wo||!m.h||!m.a?'':vol||ro?`<b>${m[sk]??'·'}</b>`:`<input type="number" min="0" class="sc" value="${m[sk]??''}" onchange="bsc('${m.id}','${sk}',this.value)">`;return`<div class="bt${w&&w==id?' wn':''}"><span>${nm}</span>${sc}</div>`};
const ok=m.h&&m.a&&!m.bye,h=tm(c,m.h),a=tm(c,m.a);let x='';
if(ok&&!ro){if(vol)x+=vsets(m);else if(!m.wo&&m.hs!=null&&m.hs==m.as)x+=`<select onchange="bpw('${m.id}',this.value)"><option value="">Ganador (penales/desempate)…</option><option value="h" ${m.pw=='h'?'selected':''}>${esc(h.name)}</option><option value="a" ${m.pw=='a'?'selected':''}>${esc(a.name)}</option></select>`;
x+=`<select onchange="setWo('${m.id}',this.value)"><option value="">Normal</option><option value="h" ${m.wo=='h'?'selected':''}>W.O. gana ${esc(h.name)}</option><option value="a" ${m.wo=='a'?'selected':''}>W.O. gana ${esc(a.name)}</option><option value="d" ${m.wo=='d'?'selected':''}>Doble W.O.</option></select>`}
const s=m.bye?'<span class="mu">Pasa directo</span>':ro?(m.s?`<span class="mu">${esc(m.s)}</span>`:''):`<input class="sl" placeholder="Día · hora · cancha" value="${esc(m.s||'')}" onchange="bs('${m.id}',this.value)">`;
return`<div class="bm"><div class="mu">${esc(m.nm)}</div>${ln('h')}${ln('a')}${x}${ok&&!ro?ixb(c,m):''}${s}</div>`}
function brk(c,ro){const p=po(c),n=c.teams.length;let h='';
if(!ro){if(n<2)return'<p class="mu">Inscribe al menos 2 equipos.</p>';h+=`<div class="card np"><h3>Sistema de clasificación y llaves</h3><div class="g"><label>Equipos que clasifican<select onchange="poS('q',this.value)">${[2,3,4,5,6,8,12,16].filter(x=>x<=n).map(x=>`<option ${x==p.q?'selected':''}>${x}</option>`).join('')}</select></label><label>Partido por 3.er puesto<select onchange="poS('third',this.value)"><option value="1" ${p.third?'selected':''}>Sí</option><option value="0" ${p.third?'':'selected'}>No</option></select></label></div><p class="mu">Fase regular: todos contra todos. Clasifican los mejores de la tabla y se arman llaves de eliminación directa (1.º vs último, 2.º vs penúltimo…) hasta la Final. Si el número no es potencia de 2, los mejores ubicados pasan directo (BYE). Si un partido termina empatado, defines el ganador (penales/desempate).</p><div class="r" style="justify-content:flex-start"><button class="pr" onclick="gbr()">Generar llaves desde la tabla</button>${c.br?`<button onclick="S.be=!S.be;R()">${S.be?'✔ Terminar edición':'✎ Editar cruces'}</button>`:''}</div><p class="mu">Clasificados actuales: ${calc(c).slice(0,p.q).map((s,i)=>(i+1)+'.º '+esc(tm(c,s.id).name)).join(' · ')}</p></div>`}
if(!c.br)return h+'<p class="mu">Aún no hay llaves.</p>';
const last=c.br.rounds[c.br.rounds.length-1].ms,fin=last.find(m=>m.nm=='Final'),tp=last.find(m=>m.nm=='Tercer puesto'),W=m=>{const i=m&&win(m);return i?tm(c,i):null},ch=W(fin),sub=fin&&los(fin)?tm(c,los(fin)):null,th3=W(tp);
if(ch)h+=`<div class="card champ">🏆 <b>Campeón:</b> ${bd(ch)}${sub?` &nbsp; 🥈 ${bd(sub)}`:''}${th3?` &nbsp; 🥉 ${bd(th3)}`:''}</div>`;
return h+`<div class="bk">${c.br.rounds.map(r=>`<div class="col"><h4>${esc(r.name)}</h4>${r.ms.map(m=>bm(c,m,ro)).join('')}</div>`).join('')}</div>`}
let ROLE='admin';const SY={on:0,got:{},did:0},P={est:null,res:{},jug:{},img:{}},RF=['hs','as','wo','sets','ph','pa','pw','f5','inf'];
const skm=m=>{const x={...m};RF.forEach(k=>delete x[k]);return x};
const strip=()=>S.t.map(({sel,...t})=>({...t,cats:t.cats.map(c=>({...c,teams:c.teams.map(({pl,...x})=>x),rounds:c.rounds.map(r=>({...r,ms:r.ms.map(skm)})),br:c.br?{rounds:c.br.rounds.map(r=>({...r,ms:r.ms.map(m=>{const x=skm(m);if(m.sh)x.h=null;if(m.sa)x.a=null;return x})}))}:undefined}))}));

  if(u){const sp=document.createElement('span');sp.textContent=em+' \u00b7 '+nm[role];bar.append(sp,btn('Salir',async()=>{await AU.signOut(au);location.reload()}))}
  else bar.append(btn('Ingresar con Google',async()=>{try{await AU.signInWithPopup(au,new AU.GoogleAuthProvider());location.reload()}catch(e){banner('No se pudo ingresar: '+(e.code||e.message))}}));
  document.body.appendChild(bar);
  F.usersDlg=()=>{const o=document.createElement('div');o.className='ov';document.body.appendChild(o);
   const draw=async()=>{let rows='';try{const s=await FS.getDocs(FS.collection(fs,'roles'));rows=s.docs.map(d=>{const id=d.id.replace(/[<>&"]/g,'');return `<div class="m"><span class="t">${id}</span><b>${nm[d.data().role]||''}</b><button data-d="${id}">\u2715</button></div>`}).join('')||'<p class="mu">Sin usuarios todav\u00eda.</p>'}catch(e){rows='<p class="mu">No se pudo leer la lista.</p>'}
    o.innerHTML=`<div class="dg"><b>Usuarios y roles</b><div class="mu"><b>C\u00f3mo funciona:</b> cualquiera con el enlace puede <b>ver</b> y descargar sin ingresar. Para dar m\u00e1s permisos, agrega aqu\u00ed el correo de Google de la persona y elige su rol: <b>Colaborador</b> (carga resultados y jugadores) o <b>Administrador</b> (todo). Esa persona debe pulsar \u00abIngresar con Google\u00bb con ese correo.</div><div class="r" style="justify-content:flex-start"><button id="ul">Copiar enlace de la app</button></div>${rows}<div class="m"><input id="ue" class="t" placeholder="correo@gmail.com"><select id="ur"><option value="edit">Colaborador (resultados y jugadores)</option><option value="admin">Administrador</option><option value="view">Lector</option></select><button class="pr" id="ua">Agregar</button></div><div class="r"><button id="ux">Cerrar</button></div></div>`;
    o.querySelector('#ux').onclick=()=>o.remove();o.querySelector('#ul').onclick=async e=>{const u=location.href.split('#')[0];try{await navigator.clipboard.writeText(u);e.target.textContent='\u00a1Copiado!'}catch(x){e.target.textContent=u}};
    o.querySelector('#ua').onclick=async()=>{const e=o.querySelector('#ue').value.trim().toLowerCase();if(!e.includes('@'))return;try{await FS.setDoc(FS.doc(fs,'roles/'+e),{role:o.querySelector('#ur').value})}catch(x){banner('No tienes permiso para esto')}draw()};
    o.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{try{await FS.deleteDoc(FS.doc(fs,'roles/'+b.dataset.d))}catch(x){}draw()})};
   draw()};
 }catch(e){banner('Error al conectar con Firebase: '+(e.code||e.message))}
 finally{F.ready()}
})();
</script>
</body></html>
